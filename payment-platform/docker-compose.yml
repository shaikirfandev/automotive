# Docker Compose for local development
# All services, databases, message brokers, and observability tools
version: "3.9"

services:
  # ==================== Infrastructure ====================
  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_dev
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ==================== Observability ====================
  
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ==================== Application Services ====================
  
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: api-gateway
      DATABASE_URL: "******postgres:5432/payments"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OTLP_ENDPOINT: "http://jaeger:4317"
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: auth-service
      DATABASE_URL: "******postgres:5432/auth_db"
      REDIS_URL: "redis://redis:6379/1"
      JWT_SECRET_KEY: "dev-secret-change-in-production"
    command: ["uvicorn", "services.auth_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: user-service
      DATABASE_URL: "******postgres:5432/user_db"
    command: ["uvicorn", "services.user_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      postgres:
        condition: service_healthy

  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      SERVICE_NAME: wallet-service
      DATABASE_URL: "******postgres:5432/wallet_db"
      REDIS_URL: "redis://redis:6379/2"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["uvicorn", "services.wallet_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      SERVICE_NAME: payment-service
      DATABASE_URL: "******postgres:5432/payment_db"
      REDIS_URL: "redis://redis:6379/3"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OTLP_ENDPOINT: "http://jaeger:4317"
    command: ["uvicorn", "services.payment_service.main:app", "--host", "0.0.0.0", "--port", "8005"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    environment:
      SERVICE_NAME: transaction-service
      DATABASE_URL: "******postgres:5432/transaction_db"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["uvicorn", "services.transaction_service.main:app", "--host", "0.0.0.0", "--port", "8006"]
    depends_on:
      postgres:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    environment:
      SERVICE_NAME: ledger-service
      DATABASE_URL: "******postgres:5432/ledger_db"
    command: ["uvicorn", "services.ledger_service.main:app", "--host", "0.0.0.0", "--port", "8007"]
    depends_on:
      postgres:
        condition: service_healthy

  fraud-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    environment:
      SERVICE_NAME: fraud-service
      DATABASE_URL: "******postgres:5432/fraud_db"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["uvicorn", "services.fraud_service.main:app", "--host", "0.0.0.0", "--port", "8008"]
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      SERVICE_NAME: notification-service
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    command: ["uvicorn", "services.notification_service.main:app", "--host", "0.0.0.0", "--port", "8009"]

  reconciliation-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      SERVICE_NAME: reconciliation-service
      DATABASE_URL: "******postgres:5432/recon_db"
    command: ["uvicorn", "services.reconciliation_service.main:app", "--host", "0.0.0.0", "--port", "8010"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:
